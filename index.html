            const [inventory, setInventory] = useState([]);
            const [inputs, setInputs] = useState({});
            const [search, setSearch] = useState("");

            useEffect(() => {
                const saved = localStorage.getItem('inv_data_cine');
                if (saved) {
                    setInventory(JSON.parse(saved));
                } else {
                    setInventory(INVENTORY_DB.map(i => ({ ...i, qty: 0 })));
                }
            }, []);

            useEffect(() => {
                if (inventory.length > 0) localStorage.setItem('inv_data_cine', JSON.stringify(inventory));
            }, [inventory]);

            const handleAdd = (code) => {
                const val = parseFloat(inputs[code] || 0);
                if (val <= 0) return;
                setInventory(prev => prev.map(item => 
                    item.code === code ? { ...item, qty: parseFloat((item.qty + val).toFixed(2)) } : item
                ));
                setInputs(prev => ({ ...prev, [code]: '' }));
            };
