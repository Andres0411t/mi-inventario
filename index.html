<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Pro - Cine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body class="bg-gray-100 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ITEMS = [
            { code: '37006', desc: 'ACEITE PARA CRISPETAS', unit: 'LITRO' },
            { code: '37160', desc: 'BABY JOHNNY 48', unit: 'UNIDAD' },
            { code: '30616', desc: 'BAG IN BOX JUGO HIT MANGO 12 LT', unit: 'UNIDAD' },
            { code: '30615', desc: 'BAG IN BOX JUGO HIT MORA 12 LT', unit: 'UNIDAD' },
            { code: '30629', desc: 'BAG IN BOX KOLA ROMAN ZERO 5 LT', unit: 'UNIDAD' },
            { code: '35031', desc: 'BAG IN BOX 5L', unit: 'UNIDAD' },
            { code: '34022', desc: 'BALDE 130 OZ', unit: 'UNIDAD' },
            { code: '34021', desc: 'BALDE 170 OZ', unit: 'UNIDAD' },
            { code: '31473', desc: 'BALDE 85 OZ', unit: 'UNIDAD' },
            { code: '31455', desc: 'BIB BRISA MANZANA 5LT', unit: 'UNIDAD' },
            { code: '35030', desc: 'BIB COCA COLA 17L', unit: 'UNIDAD' },
            { code: '35150', desc: 'BIB POSTOBON 10L', unit: 'UNIDAD' },
            { code: '35141', desc: 'BIB POSTOBON 18L', unit: 'UNIDAD' },
            { code: '34515', desc: 'BIB TE FUZE', unit: 'UNIDAD' },
            { code: '37608', desc: 'BOLSA DE QUESO CHEDDAR', unit: 'UNIDAD' },
            { code: '30331', desc: 'BOLSA KRAFT MEDIANA', unit: 'UNIDAD' },
            { code: '34060', desc: 'BOLSA SANDWICH', unit: 'UNIDAD' },
            { code: '34438', desc: 'CAJA CINE COMBITO', unit: 'UNIDAD' },
            { code: '34070', desc: 'CAJA PORTA PERRO', unit: 'UNIDAD' },
            { code: '37811', desc: 'CARAMELO', unit: 'UNIDAD' },
            { code: '37169', desc: 'CHOCOLATINA JET 25G', unit: 'UNIDAD' },
            { code: '35010', desc: 'CONFIT AGUA MANANTIAL PET 600 ML', unit: 'UNIDAD' },
            { code: '3590', desc: 'CONFITERIA BRISA LIMA LIMON PET 600 ML', unit: 'UNIDAD' },
            { code: '30589', desc: 'CONFITERIA BRISA MANZANA PET 600 ML', unit: 'UNIDAD' },
            { code: '31441', desc: 'CONFITERIA PITILLO PLA 7.2X26', unit: 'UNIDAD' },
            { code: '34252', desc: 'CONFITERIA TAPA VASO 22 OZ', unit: 'UNIDAD' },
            { code: '34253', desc: 'CONFITERIA TAPA VASO 32 OZ', unit: 'UNIDAD' },
            { code: '34254', desc: 'CONFITERIA TAPA VASO 44 OZ', unit: 'UNIDAD' },
            { code: '34291', desc: 'CONFITERIA VASO GASEOSA GRANDE 44 OZ', unit: 'UNIDAD' },
            { code: '34293', desc: 'CONFITERIA VASO GASEOSA PEQUEÑO 22 OZ', unit: 'UNIDAD' },
            { code: '34292', desc: 'CONFITERIA VASO GASEOSA MEDIANO 32 OZ', unit: 'UNIDAD' },
            { code: '30996', desc: 'CONTENEDORES 6 OZ CONFITERIA', unit: 'UNIDAD' },
            { code: '37202', desc: 'FLAVACOL', unit: 'UNIDAD' },
            { code: '30986', desc: 'GALLETA OREO TRITURADO', unit: 'KG' },
            { code: '30957', desc: 'GALLETA RAMO 60G', unit: 'UNIDAD' },
            { code: '37648', desc: 'GALON MAYONESA', unit: 'GL' },
            { code: '37642', desc: 'GALON MOSTAZA', unit: 'GL' },
            { code: '37643', desc: 'GALON TOMATE', unit: 'GL' },
            { code: '30597', desc: 'GOMAS GUSANOS ACIDOS 100G', unit: 'UNIDAD' },
            { code: '30598', desc: 'GOMAS TRULULU SABORES 100G', unit: 'UNIDAD' },
            { code: '32348', desc: 'HIELOS COCA COLA', unit: 'UNIDAD' },
            { code: '37400', desc: 'MAIZ PIRA', unit: 'KG' },
            { code: '37491', desc: 'PAN PERRO', unit: 'UNIDAD' },
            { code: '37492', desc: 'PAN SANDWICH', unit: 'UNIDAD' },
            { code: '30455', desc: 'PAPA RIPIO KRUMERCHIPS CONFITERIA', unit: 'UNIDAD' },
            { code: '30648', desc: 'PAQUETE GALLETAS OREO 54G', unit: 'UNIDAD' },
            { code: '37454', desc: 'PAQUETE NACHOS 60G', unit: 'UNIDAD' },
            { code: '37630', desc: 'SAL', unit: 'KG' },
            { code: '37646', desc: 'SALCHICHA CINECO', unit: 'UNIDAD' },
            { code: '37641', desc: 'SALSA DE PIÑA', unit: 'UNIDAD' },
            { code: '34402', desc: 'SALSERA QUESO NACHOS CONFITERIA', unit: 'UNIDAD' },
            { code: '34477', desc: 'SEPARADOR BALDE 120', unit: 'UNIDAD' },
            { code: '34476', desc: 'SEPARADOR BALDE 150', unit: 'UNIDAD' },
            { code: '34478', desc: 'SEPARADOR BALDE 85 OZ', unit: 'UNIDAD' },
            { code: '34240', desc: 'SERVILLETA SCOTT CAFETERIA BLANCA KIMBERLY', unit: 'UNIDAD' },
            { code: '30333', desc: 'STICKER DE SEGURIDAD', unit: 'UNIDAD' },
            { code: '34336', desc: 'STICKERS BOL SANDWICH', unit: 'UNIDAD' },
            { code: '37320', desc: 'TAJADA JAMON PIETRAN', unit: 'UNIDAD' },
            { code: '38709', desc: 'TAJADA QUESO MOZARELLA', unit: 'UNIDAD' },
            { code: '37614', desc: 'TAJADA QUESO SABANA', unit: 'UNIDAD' },
            { code: '30327', desc: 'TAPA CRISPETA MEDIANA 130 OZ', unit: 'UNIDAD' },
            { code: '30387', desc: 'TAPA SALSERA 4 ONZAS', unit: 'UNIDAD' },
            { code: '30649', desc: 'VASO GASEOSA NUFASA', unit: 'UNIDAD' },
            { code: '34051', desc: 'BOLSA PLASTICA', unit: 'UNIDAD' },
            { code: '30460', desc: 'CAJA CRISPETA PLATINO', unit: 'UNIDAD' },
            { code: '34110', desc: 'GUANTES DESECHABLES', unit: 'UNIDAD' }
        ];

        function App() {
            const [inventory, setInventory] = useState([]);
            const [inputs, setInputs] = useState({});
            const [search, setSearch] = useState("");

            useEffect(() => {
                const saved = localStorage.getItem('cine_v2_final');
                if (saved) {
                    setInventory(JSON.parse(saved));
                } else {
                    setInventory(ITEMS.map(i => ({ ...i, qty: 0 })));
                }
            }, []);

            useEffect(() => {
                if (inventory.length > 0) localStorage.setItem('cine_v2_final', JSON.stringify(inventory));
            }, [inventory]);

            const handleUpdate = (code, type) => {
                const val = parseFloat(inputs[code] || 0);
                if (val <= 0) return;
                
                setInventory(prev => prev.map(item => {
                    if (item.code === code) {
                        let newQty = type === 'add' ? item.qty + val : item.qty - val;
                        return { ...item, qty: parseFloat(Math.max(0, newQty).toFixed(2)) };
                    }
                    return item;
                }));
                setInputs(prev => ({ ...prev, [code]: '' }));
            };

            const resetData = () => {
                if (confirm("¿Borrar todos los conteos acumulados?")) {
                    setInventory(ITEMS.map(i => ({ ...i, qty: 0 })));
                }
            };

            const downloadPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const fecha = new Date().toLocaleString();
                doc.setFontSize(16);
                doc.text("Reporte de Inventario de Confitería", 14, 15);
                doc.setFontSize(10);
                doc.text(`Fecha: ${fecha}`, 14, 22);
                
                const data = inventory.filter(i => i.qty > 0).map(i => [i.code, i.desc, i.qty, i.unit]);
                doc.autoTable({ 
                    head: [['Cód', 'Producto', 'Total Acum.', 'Und']], 
                    body: data, 
                    startY: 28,
                    styles: { fontSize: 8 },
                    headStyles: { fillColor: [15, 23, 42] }
                });
                doc.save(`Inventario_${new Date().getTime()}.pdf`);
            };

            const filtered = inventory.filter(i => 
                i.desc.toLowerCase().includes(search.toLowerCase()) || i.code.includes(search)
            );

            return (
                <div className="max-w-lg mx-auto min-h-screen flex flex-col bg-gray-100">
                    <header className="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
                        <div className="flex flex-col">
                            <h1 className="font-bold text-sm tracking-widest uppercase">Sistema de Conteo</h1>
                            <span className="text-[10px] text-blue-400 font-bold">Modo Turno Activo</span>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={downloadPDF} title="Descargar PDF" className="bg-blue-600 p-2 rounded-lg hover:bg-blue-500 transition-colors">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            </button>
                            <button onClick={resetData} title="Reiniciar todo" className="bg-red-600 p-2 rounded-lg hover:bg-red-500 transition-colors">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                            </button>
                        </div>
                    </header>

                    <div className="p-4 flex-1">
                        <div className="relative mb-6">
                            <input 
                                className="w-full p-4 pl-12 rounded-2xl shadow-sm border-none bg-white text-slate-700 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-lg"
                                placeholder="Buscar código o nombre..."
                                onChange={(e) => setSearch(e.target.value)}
                            />
                            <svg className="absolute left-4 top-4 text-gray-400" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </div>

                        <div className="space-y-4">
                            {filtered.map(item => (
                                <div key={item.code} className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 transition-all active:scale-[0.98]">
                                    <div className="flex justify-between items-start mb-4">
                                        <div className="max-w-[70%]">
                                            <p className="text-[10px] font-bold text-blue-500 uppercase tracking-tighter">Item {item.code}</p>
                                            <h2 className="font-extrabold text-slate-800 leading-tight text-base">{item.desc}</h2>
                                            <p className="text-[10px] text-gray-400 font-medium">Unidad: {item.unit}</p>
                                        </div>
                                        <div className="bg-slate-900 text-white px-4 py-2 rounded-2xl text-center min-w-[75px] shadow-lg shadow-slate-200">
                                            <p className="text-[8px] font-bold text-blue-300 uppercase">Total</p>
                                            <p className="text-xl font-black">{item.qty}</p>
                                        </div>
                                    </div>
                                    
                                    <div className="flex gap-2">
                                        <input 
                                            type="number"
                                            inputMode="decimal"
                                            className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-4 py-3 text-lg font-bold text-slate-700 focus:bg-white focus:border-blue-400 outline-none transition-all"
                                            placeholder="Cantidad"
                                            value={inputs[item.code] || ''}
                                            onChange={(e) => setInputs({...inputs, [item.code]: e.target.value})}
                                        />
                                        <button 
                                            onClick={() => handleUpdate(item.code, 'add')}
                                            className="bg-slate-900 text-white px-5 rounded-2xl font-bold active:bg-green-600 transition-colors flex items-center justify-center"
                                        >
                                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                        </button>
                                        <button 
                                            onClick={() => handleUpdate(item.code, 'sub')}
                                            title="Corregir (Resta)"
                                            className="bg-orange-100 text-orange-600 px-5 rounded-2xl font-bold active:bg-red-200 transition-colors flex items-center justify-center border-2 border-orange-200"
                                        >
                                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h12a5 5 0 0 1 5 5v3"/></svg>
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
